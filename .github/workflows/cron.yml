name: Cron Job

on:
  schedule:
    - cron: 22 21 * * *

  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron API
        run: |
          curl -X GET "https://your-app.vercel.app/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
